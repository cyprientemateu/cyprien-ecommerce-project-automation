version: '3.3'

services:
  ui:
    ports:
      - 8888:8080
    environment:
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom
      - SERVER_TOMCAT_ACCESSLOG_ENABLED=true
      - ENDPOINTS_CATALOG=http://catalog:8080
      - ENDPOINTS_CARTS=http://carts:8080
      - ENDPOINTS_ORDERS=http://orders:8080
      - ENDPOINTS_CHECKOUT=http://checkout:8080
      - ENDPOINTS_ASSETS=http://assets:8080
    hostname: ui
    image: cyprientemateu/a1cyprien_do_it_yourself_ui:${TAG}
    restart: always
    deploy:
      resources:
        limits:
          memory: 256m
    cap_drop:
      - ALL


  catalog:
    hostname: catalog
    image: cyprientemateu/a1cyprien_do_it_yourself_catalog:${TAG}
    restart: always
    environment:
      - GIN_MODE=release
      - DB_PASSWORD=${MYSQL_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 128m
    cap_drop:
      - ALL

  catalog-db:
    image: cyprientemateu/a1cyprien_do_it_yourself_catalog_db:${TAG}
    hostname: catalog-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
      - MYSQL_DATABASE=sampledb
      - MYSQL_USER=catalog_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 128m

  carts:
    hostname: carts
    image: cyprientemateu/a1cyprien_do_it_yourself_cart:${TAG}
    restart: always
    environment:
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom
      - SERVER_TOMCAT_ACCESSLOG_ENABLED=true
      - SPRING_PROFILES_ACTIVE=dynamodb
      - CARTS_DYNAMODB_ENDPOINT=http://carts-db:8000
      - CARTS_DYNAMODB_CREATETABLE=true
      - AWS_ACCESS_KEY_ID=key
      - AWS_SECRET_ACCESS_KEY=dummy
    deploy:
      resources:
        limits:
          memory: 256m
    cap_drop:
      - ALL

  carts-db:
    image: cyprientemateu/a1cyprien_do_it_yourself_cart_dynamodb:${TAG}
    hostname: carts-db
    restart: always
    deploy:
      resources:
        limits:
          memory: 128m
    
  orders:
    hostname: orders
    image: cyprientemateu/a1cyprien_do_it_yourself_orders:${TAG}
    restart: always
    environment:
      - JAVA_OPTS=-XX:MaxRAMPercentage=75.0 -Djava.security.egd=file:/dev/urandom
      - SERVER_TOMCAT_ACCESSLOG_ENABLED=true
      - SPRING_PROFILES_ACTIVE=mysql,rabbitmq
      - SPRING_DATASOURCE_WRITER_URL=jdbc:mariadb://orders-db:3306/orders
      - SPRING_DATASOURCE_WRITER_USERNAME=orders_user
      - SPRING_DATASOURCE_WRITER_PASSWORD=${MYSQL_PASSWORD}
      - SPRING_DATASOURCE_READER_URL=jdbc:mariadb://orders-db:3306/orders
      - SPRING_DATASOURCE_READER_USERNAME=orders_user
      - SPRING_DATASOURCE_READER_PASSWORD=${MYSQL_PASSWORD}
      - SPRING_RABBITMQ_HOST=rabbitmq
    deploy:
      resources:
        limits:
          memory: 256m
    cap_drop:
      - ALL

  orders-db:
    image: cyprientemateu/a1cyprien_do_it_yourself_orders_db:${TAG}
    hostname: orders-db
    restart: always
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
      - MYSQL_DATABASE=orders
      - MYSQL_USER=orders_user
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 128m

  checkout:
    image: cyprientemateu/a1cyprien_do_it_yourself_checkout:${TAG}
    hostname: checkout
    restart: always
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid
    environment:
      - REDIS_URL=redis://checkout-redis:6379
      - ENDPOINTS_ORDERS=http://orders:8080
    deploy:
      resources:
        limits:
          memory: 256m
    cap_drop:
      - ALL

  checkout-db:
    image: cyprientemateu/a1cyprien_do_it_yourself_checkout_db:${TAG}
    hostname: checkout-db
    restart: always
    deploy:
      resources:
        limits:
          memory: 128m

  assets:
    hostname: assets
    environment:
      - PORT=8080
    image: cyprientemateu/a1cyprien_do_it_yourself_assets:${TAG}
    restart: always
    deploy:
      resources:
        limits:
          memory: 64m
    cap_drop:
      - ALL

  rabbitmq:
    image: cyprientemateu/a1cyprien_do_it_yourself_orders_db_rabbitmq:${TAG}
    hostname: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
